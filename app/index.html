<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilier Urbain</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <div id="code-appareil-label" hidden></div>

  <div id="modal-code-appareil" class="modal-overlay" hidden>
    <div class="modal-contenu">
      <h2>Identification de l'appareil</h2>
      <p>Entrez un code court (2 à 4 lettres) pour identifier cet appareil — par exemple vos initiales. Il ne sera demandé qu'une seule fois.</p>
      <input type="text" id="input-code-appareil" maxlength="4" placeholder="Ex. MM">
      <p id="erreur-code-appareil" class="erreur" hidden></p>
      <button id="bouton-valider-code-appareil">Valider</button>
    </div>
  </div>

  <div class="boutons-flottants">
    <button id="bouton-ajouter-mobilier" class="bouton-flottant">+ Mobilier urbain</button>
    <button id="bouton-ajouter-commerce" class="bouton-flottant bouton-flottant-commerce">+ Commerce</button>
  </div>

  <div id="modal-mobilier-urbain" class="modal-overlay" hidden>
    <div class="modal-contenu">
      <h2 id="titre-modal-mobilier">Nouveau mobilier urbain</h2>
      <form id="form-mobilier-urbain">
        <label for="mobilier-type">Type</label>
        <select id="mobilier-type">
          <option>Banc</option>
          <option>Corbeille</option>
          <option>Distributeur de sacs</option>
          <option>Arrêt de bus</option>
          <option>Abri bus</option>
        </select>

        <label for="mobilier-etat">État</label>
        <select id="mobilier-etat">
          <option>Bon</option>
          <option>Moyen</option>
          <option>Mauvais</option>
          <option>HS</option>
        </select>

        <label for="mobilier-nombre">Nombre</label>
        <input type="number" id="mobilier-nombre" value="1" min="1">

        <label for="mobilier-commentaire">Commentaire (optionnel)</label>
        <textarea id="mobilier-commentaire" rows="2"></textarea>

        <div class="modal-boutons">
          <button type="button" id="bouton-supprimer-mobilier" class="bouton-danger" hidden>Supprimer</button>
          <button type="button" id="bouton-annuler-mobilier">Annuler</button>
          <button type="button" id="bouton-enregistrer-mobilier">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-commerce" class="modal-overlay" hidden>
    <div class="modal-contenu">
      <h2 id="titre-modal-commerce">Nouveau commerce</h2>
      <form id="form-commerce">
        <label for="commerce-nom">Nom du commerce (optionnel)</label>
        <input type="text" id="commerce-nom" placeholder="Ex. Boulangerie Dupont">

        <label for="commerce-type">Type de commerce</label>
        <select id="commerce-type">
          <option>Supérette</option>
          <option>Coiffeur</option>
          <option>Banque</option>
          <option>Vêtements</option>
          <option>Boulangerie</option>
          <option>Restaurant</option>
          <option>Onglerie</option>
          <option>Opticien</option>
          <option>Autre commerce</option>
          <option>Autre service</option>
        </select>

        <label for="commerce-etat">État</label>
        <select id="commerce-etat">
          <option>Vacant</option>
          <option>Occupé</option>
        </select>

        <label for="commerce-date-fermeture">Date de fermeture (mois/année, optionnel)</label>
        <input type="month" id="commerce-date-fermeture">

        <label for="commerce-commentaire">Commentaire (optionnel)</label>
        <textarea id="commerce-commentaire" rows="2"></textarea>

        <div class="modal-boutons">
          <button type="button" id="bouton-supprimer-commerce" class="bouton-danger" hidden>Supprimer</button>
          <button type="button" id="bouton-annuler-commerce">Annuler</button>
          <button type="button" id="bouton-enregistrer-commerce">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script src="js/position.js"></script>
  <script src="js/device.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mobilier.js"></script>
  <script src="js/commerce.js"></script>
</body>
</html>
