<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tests automatisés</title>
  <!-- style.css est chargée dynamiquement plus bas (anti-cache), pour pouvoir
       vérifier les règles de positionnement critiques (ex. la bannière
       d'erreur ne doit pas recouvrir les contrôles du coin supérieur gauche)
       — un bug de ce type (§ audit 2026-08-23) était invisible aux 67 tests
       précédents faute de charger ce fichier ici. -->
  <style>
    body { font-family: monospace; padding: 16px; white-space: pre-wrap; }
    #harnais { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <h1>Tests automatisés</h1>
  <div id="resultats">Exécution en cours…</div>

  <!-- Harnais DOM : reproduit la structure minimale d'index.html, hors écran,
       pour pouvoir charger l'app réelle (map.js, mobilier.js, commerce.js...)
       et rejouer ses parcours (y compris les échecs simulés) sans rien afficher. -->
  <div id="harnais">
    <div id="map"></div>

    <div id="banniere-selection" hidden></div>

    <div id="banniere-erreur" class="banniere-erreur" hidden>
      <span id="banniere-erreur-texte"></span>

    </div>

    <div id="code-appareil-label" hidden></div>

    <button id="bouton-filtres" class="bouton-filtres-icone"></button>
    <button id="bouton-filtres-mobile" class="bouton-filtres-icone"></button>
    <button id="bouton-recentrer"></button>
    <button id="bouton-recentrer-mobile"></button>
    <div id="panneau-filtres" hidden>
      <label><input type="checkbox" class="case-filtre" data-categorie="Banc" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Corbeille" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Distributeur de sacs" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Arrêt de bus" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Abri bus" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Recyclage verre" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Recyclage électronique" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Recyclage autre" checked></label>
      <label><input type="checkbox" class="case-filtre" data-categorie="Commerce" checked></label>
    </div>

    <div id="modal-code-appareil" hidden>
      <input type="text" id="input-code-appareil" maxlength="4">
      <p id="erreur-code-appareil" hidden></p>
      <button id="bouton-valider-code-appareil">Valider</button>
    </div>

    <button id="bouton-ajouter-mobilier"></button>
    <button id="bouton-ajouter-commerce"></button>

    <div id="barre-onglets-mobile">
      <button class="onglet actif" data-onglet="carte" id="onglet-carte"></button>
      <button class="onglet" data-onglet="mobilier" id="onglet-mobilier"></button>
      <button class="onglet" data-onglet="commerce" id="onglet-commerce"></button>
      <button class="onglet" data-onglet="fichier" id="onglet-fichier"></button>

    <div id="ecran-fichier" hidden>
      <button type="button" id="bouton-exporter-mobile"></button>
      <button type="button" id="bouton-importer-mobile"></button>

    <div id="modal-mobilier-urbain" class="panneau-formulaire" hidden>
      <h2 id="titre-modal-mobilier"></h2>
      <form id="form-mobilier-urbain">
        <select id="mobilier-type">
          <option>Banc</option>
          <option>Corbeille</option>
          <option>Distributeur de sacs</option>
          <option>Arrêt de bus</option>
          <option>Abri bus</option>
          <option>Recyclage verre</option>
          <option>Recyclage électronique</option>
          <option>Recyclage autre</option>
        </select>
        <select id="mobilier-etat">
          <option>Bon</option>
          <option>Moyen</option>
          <option>Mauvais</option>
          <option>HS</option>
        </select>
        <input type="number" id="mobilier-nombre" value="1" min="1">
        <textarea id="mobilier-commentaire"></textarea>
        <button type="button" id="bouton-annuler-mobilier">Annuler</button>
        <button type="submit" id="bouton-enregistrer-mobilier">Enregistrer</button>

    </div>

    <div id="modal-commerce" class="panneau-formulaire" hidden>
      <h2 id="titre-modal-commerce"></h2>
      <form id="form-commerce">
        <input type="text" id="commerce-nom">
        <select id="commerce-type">
          <option>Supérette</option>
          <option>Coiffeur</option>
          <option>Banque</option>
          <option>Vêtements</option>
          <option>Boulangerie</option>
          <option>Restaurant</option>
          <option>Onglerie</option>
          <option>Opticien</option>
          <option>Autre commerce</option>
          <option>Autre service</option>
        </select>
        <select id="commerce-etat">
          <option>Vacant</option>
          <option>Occupé</option>
        </select>
        <input type="month" id="commerce-date-fermeture">
        <textarea id="commerce-commentaire"></textarea>
        <button type="button" id="bouton-annuler-commerce">Annuler</button>
        <button type="submit" id="bouton-enregistrer-commerce">Enregistrer</button>

    </div>

    <button id="bouton-exporter"></button>
    <button id="bouton-importer"></button>
    <input type="file" id="input-fichier-import" accept=".gpkg" hidden>
    <div id="modal-import-choix" hidden>
      <button type="button" id="bouton-import-fusionner">Fusionner</button>
      <button type="button" id="bouton-import-remplacer">Remplacer</button>
      <button type="button" id="bouton-import-annuler">Annuler</button>
    </div>
  </div>

  <script>
    // Isolation des tests : bases IndexedDB / clés localStorage distinctes de
    // l'app réelle, pour ne jamais risquer de corrompre des données de terrain.
    const DB_NOM_OVERRIDE = 'MobilierUrbainDB_TEST';
    const CLE_CODE_APPAREIL_OVERRIDE = 'mobilierUrbain_codeAppareil_TEST';
    const CLE_COMPTEUR_LOCAL_OVERRIDE = 'mobilierUrbain_compteurLocal_TEST';
  </script>

  <script src="../lib/leaflet/leaflet.js"></script>
  <script src="../lib/geopackage/geopackage.min.js"></script>

  <script>
    // Les fichiers de l'app sont chargés dynamiquement avec un paramètre
    // anti-cache : sans ça, le navigateur peut rejouer une version mise en
    // cache d'une session précédente, et les tests valideraient silencieusement
    // un code obsolète au lieu du code réellement présent sur le disque.
    function chargerScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Échec de chargement : ' + src));
        document.body.appendChild(script);
      });
    }

    function chargerFeuilleDeStyle(href) {
      return new Promise((resolve, reject) => {
        const lien = document.createElement('link');
        lien.rel = 'stylesheet';
        lien.href = href;
        lien.onload = resolve;
        lien.onerror = () => reject(new Error('Échec de chargement : ' + href));
        document.head.appendChild(lien);
      });
    }

    async function chargerFichiersApp() {
      const antiCache = '?t=' + Date.now();
      await chargerFeuilleDeStyle('../css/style.css' + antiCache);
      const fichiers = ['util.js', 'map.js', 'position.js', 'device.js', 'geo.js', 'icones.js', 'storage.js', 'filtres.js', 'interface.js', 'mobilier.js', 'commerce.js', 'gpkg.js', 'pwa.js'];
      for (const fichier of fichiers) {
        await chargerScript('../js/' + fichier + antiCache);
      }
      // Chargé comme script normal (pas comme un vrai service worker) uniquement pour
      // accéder à sa constante FICHIERS_APP — self.addEventListener(...) s'accroche
      // sans risque à window (self === window ici), jamais déclenché dans ce harnais.
      await chargerScript('../service-worker.js' + antiCache);
    }

    const resultats = [];
    let ok = 0;
    let total = 0;
    let ignores = 0;

    function verifier(nom, condition) {
      total++;
      if (condition) {
        ok++;
        resultats.push(`OK   - ${nom}`);
      } else {
        resultats.push(`FAIL - ${nom}`);
      }
    }

    // Distinct de FAIL/OK : un test non exécutable dans cet environnement
    // précis (ex. redéfinir window.visualViewport, refusé par certains
    // navigateurs) n'est ni un succès ni un échec de l'app — le compter comme
    // OK masquerait qu'il n'a en fait rien vérifié (demande du 23/08).
    function ignorer(nom, raison) {
      ignores++;
      resultats.push(`SKIP - ${nom} (${raison})`);
    }

    async function verifierAsync(nom, fonctionAsync) {
      try {
        verifier(nom, await fonctionAsync());
      } catch (e) {
        verifier(nom, false);
        resultats.push(`       -> exception inattendue : ${e.message}`);
      }
    }

    function attendre(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Attend qu'une condition observable devienne vraie, au lieu d'attendre
    // directement une promesse interne : permet de déclencher les actions via
    // de vrais clics (dont le gestionnaire est asynchrone et n'est pas
    // accessible depuis l'extérieur) tout en restant déterministe.
    function attendreCondition(predicat, timeoutMs = 2000, intervalMs = 20) {
      return new Promise((resolve, reject) => {
        const debut = Date.now();
        (function boucle() {
          if (predicat()) return resolve();
          if (Date.now() - debut > timeoutMs) return reject(new Error('attendreCondition : délai dépassé'));
          setTimeout(boucle, intervalMs);
        })();
      });
    }

    // alert()/confirm() sont neutralisées pour que la suite tourne sans
    // interaction humaine dans n'importe quel navigateur (pas seulement
    // l'outil de Claude, qui les neutralise déjà de son côté). confirmReponse
    // est modifiable par chaque test pour simuler acceptation ou refus.
    const alertesCapturees = [];
    let confirmReponse = true;
    const confirmMessages = [];
    window.alert = (message) => { alertesCapturees.push(message); };
    window.confirm = (message) => { confirmMessages.push(message); return confirmReponse; };
    function derniereAlerte() {
      return alertesCapturees[alertesCapturees.length - 1] || '';
    }

    function masquerBanniere() {
      document.getElementById('banniere-erreur').hidden = true;
    }
    function banniereVisibleAvec(sousChaine) {
      const banniere = document.getElementById('banniere-erreur');
      const texte = document.getElementById('banniere-erreur-texte').textContent;
      return banniere.hidden === false && texte.includes(sousChaine);
    }

    function remplirFormulaireMobilier({ type, etat = 'Bon', nombre = '1', commentaire = '' }) {
      document.getElementById('mobilier-type').value = type;
      document.getElementById('mobilier-etat').value = etat;
      document.getElementById('mobilier-nombre').value = nombre;
      document.getElementById('mobilier-commentaire').value = commentaire;
    }

    function remplirFormulaireCommerce({ nom = '', type, etat = 'Vacant', dateFermeture = '', commentaire = '' }) {
      document.getElementById('commerce-nom').value = nom;
      document.getElementById('commerce-type').value = type;
      document.getElementById('commerce-etat').value = etat;
      document.getElementById('commerce-date-fermeture').value = dateFermeture;
      document.getElementById('commerce-commentaire').value = commentaire;
    }

    // Ouvre le popup Leaflet du marqueur et renvoie son bouton "Modifier"
    // (le premier des deux, depuis la séparation Modifier/Supprimer du
    // 23/08) — exerce le vrai attribut onclick généré par
    // construirePopupMobilier/Commerce, pas un raccourci vers la fonction.
    function boutonPopup(marker) {
      marker.openPopup();
      return marker.getPopup().getElement().querySelectorAll('button')[0];
    }

    // Idem pour le bouton "Supprimer" (le second), qui supprime directement
    // sans passer par le panneau d'édition.
    function boutonPopupSupprimer(marker) {
      marker.openPopup();
      return marker.getPopup().getElement().querySelectorAll('button')[1];
    }

    function executerTestsPurLogique() {
      // --- calculDistanceMetres (app/js/geo.js) ---
      verifier(
        'distance nulle entre deux points identiques',
        calculDistanceMetres([48.8032, 2.1673], [48.8032, 2.1673]) < 0.01
      );
      verifier(
        'distance ~111 km pour 1 degré de latitude',
        Math.abs(calculDistanceMetres([0, 0], [1, 0]) - 111195) < 500
      );
      verifier(
        'distance courte plausible pour un petit écart de coordonnées',
        (() => {
          const d = calculDistanceMetres([48.8032, 2.1673], [48.80321, 2.16731]);
          return d > 0 && d < 20;
        })()
      );

      // --- objetProcheExiste (app/js/geo.js) ---
      const objetsTest = [
        { type_objet: 'Banc', lat: 48.8032, lon: 2.1673 },
        { type_objet: 'Corbeille', lat: 48.8100, lon: 2.1700 }
      ];
      verifier(
        'doublon détecté : même type, même position',
        objetProcheExiste(objetsTest, 'Banc', 'type_objet', [48.8032, 2.1673], 5) === true
      );
      verifier(
        'pas de doublon : type différent au même endroit',
        objetProcheExiste(objetsTest, 'Arrêt de bus', 'type_objet', [48.8032, 2.1673], 5) === false
      );
      verifier(
        'pas de doublon : même type mais loin',
        objetProcheExiste(objetsTest, 'Banc', 'type_objet', [48.9, 2.3], 5) === false
      );

      // --- codeAppareilValide (app/js/device.js) ---
      verifier('code valide 2 lettres', codeAppareilValide('MM') === true);
      verifier('code valide 4 lettres', codeAppareilValide('IPHO') === true);
      verifier('code invalide avec chiffre', codeAppareilValide('M1') === false);
      verifier('code invalide vide', codeAppareilValide('') === false);
      verifier('code invalide trop long', codeAppareilValide('TROPLONG') === false);


      // --- echapperHtml (app/js/util.js) : protection XSS de base ---
      verifier(
        'echapperHtml échappe les balises HTML',
        echapperHtml('<img src=x onerror=alert(1)>') === '&lt;img src=x onerror=alert(1)&gt;'
      );
      verifier(
        'echapperHtml échappe les esperluettes',
        echapperHtml('Café & Cie') === 'Café &amp; Cie'
      );
      verifier(
        'echapperHtml laisse le texte normal intact',
        echapperHtml('Boulangerie Dupont') === 'Boulangerie Dupont'
      );

      // --- iconeMobilier / iconeCommerce (app/js/icones.js) ---
      verifier(
        'iconeMobilier renvoie le bon fichier SVG pour chaque type',
        Object.entries({
          'Banc': 'banc',
          'Corbeille': 'corbeille',
          'Distributeur de sacs': 'distributeur-sacs',
          'Arrêt de bus': 'arret-bus',
          'Abri bus': 'abri-bus',
          'Recyclage verre': 'recyclage-verre',
          'Recyclage électronique': 'recyclage-electronique',
          'Recyclage autre': 'recyclage-autre'
        }).every(([type, fichier]) => iconeMobilier(type).options.iconUrl === `icons/${fichier}.svg`)
      );
      verifier(
        'iconeCommerce renvoie le bon fichier SVG selon l\'état',
        iconeCommerce('Occupé').options.iconUrl === 'icons/commerce-occupe.svg'
        && iconeCommerce('Vacant').options.iconUrl === 'icons/commerce-vacant.svg'
      );

      // --- style.css : la bannière d'erreur ne doit pas recouvrir les
      // contrôles du coin supérieur gauche (zoom Leaflet ≈ 75px de haut,
      // barre d'outils PC, icône filtre mobile) — sinon ces contrôles
      // deviennent silencieusement inutilisables tant qu'une bannière est
      // affichée (ex. « Position GPS indisponible », très fréquent).
      // Régression trouvée lors de l'audit du 2026-08-23 : ce test aurait dû
      // exister depuis le départ mais 'style.css' n'était pas chargé ici.
      verifier(
        'la bannière d\'erreur est décalée sous les contrôles du coin supérieur gauche',
        (() => {
          // display:none (dû à [hidden]) fait renvoyer 'auto' par getComputedStyle :
          // il faut momentanément l'afficher pour lire la vraie position appliquée.
          const banniere = document.getElementById('banniere-erreur');
          const etaitCachee = banniere.hidden;
          banniere.hidden = false;
          const top = parseFloat(getComputedStyle(banniere).top);
          banniere.hidden = etaitCachee;
          return top >= 75;
        })()
      );

      // --- Badge de quantité sur iconeMobilier (app/js/icones.js) ---
      verifier(
        'iconeMobilier sans nombre (ou nombre=1) reste une icône simple, sans badge',
        typeof iconeMobilier('Banc').options.iconUrl === 'string'
        && typeof iconeMobilier('Banc', 1).options.iconUrl === 'string'
      );
      verifier(
        'iconeMobilier avec nombre > 1 ajoute un badge visible dans l\'icône',
        (() => {
          const icone = iconeMobilier('Banc', 3);
          return icone.options.className === 'icone-mobilier-avec-badge'
            && icone.options.html.includes('badge-nombre')
            && icone.options.html.includes('>3<');
        })()
      );

      // --- encoderPointGeoPackageBinary (app/js/gpkg.js) ---
      verifier(
        'encoderPointGeoPackageBinary produit un en-tête GeoPackageBinary valide',
        (() => {
          const octets = encoderPointGeoPackageBinary(2.1673, 48.8032, 4326);
          const vue = new DataView(octets.buffer);
          return octets.length === 29
            && vue.getUint8(0) === 0x47 && vue.getUint8(1) === 0x50 // 'G','P'
            && vue.getInt32(4, true) === 4326                       // srs_id
            && vue.getUint32(9, true) === 1;                        // type WKB = Point
        })()
      );
      verifier(
        'encoderPointGeoPackageBinary encode les coordonnées exactes (lon/lat, pas lat/lon)',
        (() => {
          const octets = encoderPointGeoPackageBinary(2.1673, 48.8032, 4326);
          const vue = new DataView(octets.buffer);
          return Math.abs(vue.getFloat64(13, true) - 2.1673) < 1e-9
            && Math.abs(vue.getFloat64(21, true) - 48.8032) < 1e-9;
        })()
      );

      // --- nomFichierExport (app/js/gpkg.js) ---
      verifier(
        'nomFichierExport construit un nom lisible avec code appareil et date',
        nomFichierExport('AND', new Date('2026-08-22T10:00:00.000Z')) === 'mobilier_urbain_AND_2026-08-22.gpkg'
      );
      verifier(
        'nomFichierExport gère un code appareil manquant sans planter',
        nomFichierExport(null, new Date('2026-08-22T10:00:00.000Z')) === 'mobilier_urbain_XXX_2026-08-22.gpkg'
      );

      // --- messageResumeImport (app/js/gpkg.js) : audit 2026-08-23, point 1 ---
      verifier(
        'messageResumeImport détaille chaque catégorie d\'anomalie présente',
        (() => {
          const message = messageResumeImport({
            mobiliers: [{}, {}], commerces: [{}],
            compteurs: { geometrieInvalide: 2, champsManquants: 1, typeNonReconnu: 0 }
          });
          return message.includes('3 objet(s)')
            && message.includes('2 ignoré(s) (géométrie invalide)')
            && message.includes('1 ignoré(s) (champs manquants ou corrompus)')
            && !message.includes('type de mobilier non reconnu');
        })()
      );
      verifier(
        'messageResumeImport reste sobre quand il n\'y a aucune anomalie',
        messageResumeImport({ mobiliers: [{}], commerces: [], compteurs: { geometrieInvalide: 0, champsManquants: 0, typeNonReconnu: 0 } })
          === 'Import terminé : 1 objet(s) pris en compte.'
      );

      // --- estAffichagePC / positionnerPanneauFormulaire (app/js/interface.js) ---
      verifier(
        'estAffichagePC reflète le seuil de largeur (768px)',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
          const large = estAffichagePC() === true;
          Object.defineProperty(window, 'innerWidth', { value: 400, configurable: true });
          const etroit = estAffichagePC() === false;
          Object.defineProperty(window, 'innerWidth', original);
          return large && etroit;
        })()
      );
      verifier(
        'positionnerPanneauFormulaire ne positionne rien sur mobile (écran plein géré en CSS)',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 400, configurable: true });
          const panneau = document.createElement('div');
          panneau.style.setProperty('--popover-top', '999px');
          positionnerPanneauFormulaire(panneau, [48.8032, 2.1673]);
          const inchange = panneau.style.getPropertyValue('--popover-top') === '999px';
          Object.defineProperty(window, 'innerWidth', original);
          return inchange;
        })()
      );
      verifier(
        'positionnerPanneauFormulaire calcule une position sur PC, dans les limites de l\'écran',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 1200, configurable: true });
          const panneau = document.createElement('div');
          positionnerPanneauFormulaire(panneau, [48.8032, 2.1673]);
          const top = parseFloat(panneau.style.getPropertyValue('--popover-top'));
          const left = parseFloat(panneau.style.getPropertyValue('--popover-left'));
          Object.defineProperty(window, 'innerWidth', original);
          return top >= 10 && left >= 10 && left <= 1200 - 300 - 10;
        })()
      );

      // --- Demande du 23/08, §A.3 : panneau déplaçable sur PC (poignée = titre) ---
      verifier(
        'interface : le titre du panneau mobilier est une vraie poignée de déplacement (mousedown/mousemove met à jour la position)',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
          const panneau = document.getElementById('modal-mobilier-urbain');
          const poignee = document.getElementById('titre-modal-mobilier');
          panneau.hidden = false;
          panneau.style.setProperty('--popover-left', '100px');
          panneau.style.setProperty('--popover-top', '100px');

          poignee.dispatchEvent(new MouseEvent('mousedown', { clientX: 150, clientY: 150, bubbles: true }));
          document.dispatchEvent(new MouseEvent('mousemove', { clientX: 220, clientY: 190, bubbles: true }));
          document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));

          const aBouge = panneau.style.getPropertyValue('--popover-left') !== '100px'
            && panneau.style.getPropertyValue('--popover-top') !== '100px';
          panneau.hidden = true;
          Object.defineProperty(window, 'innerWidth', original);
          return aBouge;
        })()
      );
      verifier(
        'interface : le déplacement du panneau reste sans effet sur mobile (pas de poignée hors PC)',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 400, configurable: true });
          const panneau = document.getElementById('modal-commerce');
          const poignee = document.getElementById('titre-modal-commerce');
          panneau.hidden = false;
          panneau.style.setProperty('--popover-left', '50px');

          poignee.dispatchEvent(new MouseEvent('mousedown', { clientX: 150, clientY: 150, bubbles: true }));
          document.dispatchEvent(new MouseEvent('mousemove', { clientX: 300, clientY: 300, bubbles: true }));

      // Corrigé par un focus automatique + mémorisation du dernier type, PC
      // uniquement, pour la saisie en chaîne. Focus sur le bouton Enregistrer
      // lui-même (pas la liste Type) : retour utilisateur du 23/08 — sur
      // certains navigateurs, Entrée avec le focus sur un <select> rouvre sa
      // liste au lieu de soumettre le formulaire. ---
      await verifierAsync('mobilier PC : le type créé est mémorisé et pré-rempli à la prochaine création, focus sur Enregistrer, Entrée seule suffit ensuite', async () => {
        const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
        Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
        onPositionRecue({ coords: { latitude: 70, longitude: 70 } });

        document.getElementById('bouton-ajouter-mobilier').click();
        document.getElementById('mobilier-type').value = 'Abri bus';
        document.getElementById('form-mobilier-urbain').requestSubmit();
        await attendreCondition(() => document.getElementById('modal-mobilier-urbain').hidden === true);

        document.getElementById('bouton-ajouter-mobilier').click();
        const typePreRempli = document.getElementById('mobilier-type').value === 'Abri bus';
        const focusSurBouton = document.activeElement === document.getElementById('bouton-enregistrer-mobilier');
        // Entrée seule (aucune autre interaction) doit suffire à enregistrer un second objet.
        document.getElementById('form-mobilier-urbain').requestSubmit();
        await attendreCondition(() => document.getElementById('modal-mobilier-urbain').hidden === true);

        const objets = (await listerMobilierUrbain()).filter((o) => o.lat === 70 && o.lon === 70);
        Object.defineProperty(window, 'innerWidth', original);
        return typePreRempli && focusSurBouton && objets.length === 2 && objets.every((o) => o.type_objet === 'Abri bus');
      });
      await verifierAsync('mobilier : sur mobile, le type par défaut reste "Banc" et rien n\'est focus automatiquement (pas de clavier virtuel imposé)', async () => {
        const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
        Object.defineProperty(window, 'innerWidth', { value: 400, configurable: true });
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

        document.getElementById('bouton-ajouter-mobilier').click();
        const typeParDefaut = document.getElementById('mobilier-type').value === 'Banc';
        const rienFocus = document.activeElement !== document.getElementById('bouton-enregistrer-mobilier')
          && document.activeElement !== document.getElementById('mobilier-type');
        fermerFormulaireMobilier();

        Object.defineProperty(window, 'innerWidth', original);
        return typeParDefaut && rienFocus;
      });
      await verifierAsync('commerce PC : le type créé est mémorisé et pré-rempli à la prochaine création, focus sur Enregistrer', async () => {
        const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
        Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
        onPositionRecue({ coords: { latitude: 71, longitude: 71 } });

        document.getElementById('bouton-ajouter-commerce').click();
        document.getElementById('commerce-type').value = 'Onglerie';
        document.getElementById('form-commerce').requestSubmit();
        await attendreCondition(() => document.getElementById('modal-commerce').hidden === true);

        document.getElementById('bouton-ajouter-commerce').click();
        const typePreRempli = document.getElementById('commerce-type').value === 'Onglerie';
        const focusSurBouton = document.activeElement === document.getElementById('bouton-enregistrer-commerce');
        fermerFormulaireCommerce();

        Object.defineProperty(window, 'innerWidth', original);
        return typePreRempli && focusSurBouton;
      });

      // --- Demande du 23/08, §D : couleurs de fond réelles des fichiers icônes ---
      await verifierAsync('icônes : les couleurs de fond attendues sont bien appliquées (une couleur distincte par type de mobilier + vert/rouge commerce)', async () => {
        const attendus = {
          'banc.svg': '#1b5e20',
          'corbeille.svg': '#e65100',
          'distributeur-sacs.svg': '#5d4037',
          'arret-bus.svg': '#29b6f6',
          'abri-bus.svg': '#1a73e8',
          'recyclage-verre.svg': '#7b1fa2',
          'recyclage-electronique.svg': '#7b1fa2',
          'recyclage-autre.svg': '#7b1fa2',
          'commerce-occupe.svg': '#4caf50',
          'commerce-vacant.svg': '#c62828'
        };
        const resultats = await Promise.all(Object.entries(attendus).map(async ([fichier, couleur]) => {
          const texte = await (await fetch('../icons/' + fichier)).text();
          return texte.toLowerCase().includes(couleur.toLowerCase());
        }));
        return resultats.every(Boolean);
      });

      // --- Nouvelle catégorie recyclage (24/08) : ajout de 3 types de mobilier
      // en fin de liste (Recyclage verre/électronique/autre) ---
      verifier(
        'filtres : les 3 nouvelles catégories recyclage sont présentes et visibles par défaut',
        ['Recyclage verre', 'Recyclage électronique', 'Recyclage autre'].every(
          (categorie) => CATEGORIES_FILTRE.includes(categorie) && categoriesVisibles.has(categorie)
        )
      );
      verifier(
        'raccourcis clavier PC : 6/7/8 sélectionnent les 3 types recyclage (extension de 1-5 à 1-8)',
        (() => {
          const original = Object.getOwnPropertyDescriptor(window, 'innerWidth');
          Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
          onPositionRecue({ coords: { latitude: 69, longitude: 69 } });
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

          document.getElementById('bouton-ajouter-mobilier').click();
          document.dispatchEvent(new KeyboardEvent('keydown', { key: '6', bubbles: true, cancelable: true }));
          const t6 = document.getElementById('mobilier-type').value === 'Recyclage verre';
          document.dispatchEvent(new KeyboardEvent('keydown', { key: '7', bubbles: true, cancelable: true }));
          const t7 = document.getElementById('mobilier-type').value === 'Recyclage électronique';
          document.dispatchEvent(new KeyboardEvent('keydown', { key: '8', bubbles: true, cancelable: true }));
          const t8 = document.getElementById('mobilier-type').value === 'Recyclage autre';
          fermerFormulaireMobilier();

          Object.defineProperty(window, 'innerWidth', original);
          return t6 && t7 && t8;
        })()
      );
      await verifierAsync('gpkg : les 3 nouveaux types recyclage s\'exportent et se réimportent fidèlement (comme les 5 types existants)', async () => {
        await viderStore('mobilier_urbain');
        const maintenant = '2026-08-24T12:00:00.000Z';
        const sources = [
          { uid: 'TST-RECY-1', type_objet: 'Recyclage verre', etat: 'Bon', nombre: 1, commentaire: '', last_update: maintenant, lat: 48.85, lon: 2.21 },
          { uid: 'TST-RECY-2', type_objet: 'Recyclage électronique', etat: 'Bon', nombre: 1, commentaire: '', last_update: maintenant, lat: 48.86, lon: 2.22 },
          { uid: 'TST-RECY-3', type_objet: 'Recyclage autre', etat: 'Moyen', nombre: 2, commentaire: 'Test', last_update: maintenant, lat: 48.87, lon: 2.23 }
        ];
        for (const o of sources) await enregistrerMobilierUrbain(o);

        const buffer = await construireGpkg();
        const gp = await window.GeoPackage.GeoPackageAPI.open(new Uint8Array(buffer));
        const releve = lireGpkg(gp);
        gp.close();

        return sources.every((source) => {
          const relu = releve.mobiliers.find((m) => m.uid === source.uid);
          return relu && relu.type_objet === source.type_objet && relu.etat === source.etat && relu.nombre === source.nombre;
        }) && releve.compteurs.typeNonReconnu === 0;
      });

      // --- Point d'attention explicite de la demande : les mobiliers déjà
      // enregistrés (types existants avant cet ajout) ne doivent subir aucun
      // impact — vérifié par un aller-retour complet sur un type "ancien". ---
      await verifierAsync('gpkg : un mobilier d\'un type déjà existant (créé avant l\'ajout du recyclage) reste inchangé à l\'export/import', async () => {
        await viderStore('mobilier_urbain');
        const ancien = { uid: 'TST-COMPAT-1', type_objet: 'Corbeille', etat: 'Bon', nombre: 1, commentaire: 'Existant avant le 24/08', last_update: '2026-08-01T00:00:00.000Z', lat: 48.88, lon: 2.24 };
        await enregistrerMobilierUrbain(ancien);
        afficherMarqueurMobilier(ancien);

        const buffer = await construireGpkg();
        const gp = await window.GeoPackage.GeoPackageAPI.open(new Uint8Array(buffer));
        const releve = lireGpkg(gp);
        gp.close();

        const relu = releve.mobiliers.find((m) => m.uid === 'TST-COMPAT-1');
        return !!relu && relu.type_objet === 'Corbeille' && relu.etat === 'Bon'
          && relu.commentaire === 'Existant avant le 24/08'
          && iconeMobilier('Corbeille').options.iconUrl === 'icons/corbeille.svg'; // icône inchangée
      });

      // --- Retour de terrain du 24/08 : chaque point de fermeture de panneau
      // doit bien déclencher reafficherBarresMobiles(), pas seulement la
      // fonction elle-même (vérifiée en logique pure ci-dessus) ---
      await verifierAsync('mobilier : fermer le panneau réaffirme la visibilité de la barre d\'onglets même si elle avait été masquée par erreur', async () => {
        onPositionRecue({ coords: { latitude: 67, longitude: 67 } });
        document.getElementById('bouton-ajouter-mobilier').click();
        document.getElementById('barre-onglets-mobile').style.display = 'none'; // simule le bug
        fermerFormulaireMobilier();
        return document.getElementById('barre-onglets-mobile').style.display === '';
      });
      await verifierAsync('commerce : fermer le panneau réaffirme la visibilité de la barre d\'onglets même si elle avait été masquée par erreur', async () => {
        onPositionRecue({ coords: { latitude: 68, longitude: 68 } });
        document.getElementById('bouton-ajouter-commerce').click();
        document.getElementById('barre-onglets-mobile').style.display = 'none'; // simule le bug
        fermerFormulaireCommerce();
        return document.getElementById('barre-onglets-mobile').style.display === '';
      });
      await verifierAsync('écran Fichier : le fermer réaffirme la visibilité de la barre d\'onglets même si elle avait été masquée par erreur', async () => {
        ouvrirEcranFichier();
        document.getElementById('barre-onglets-mobile').style.display = 'none'; // simule le bug
        fermerEcranFichier();
        return document.getElementById('barre-onglets-mobile').style.display === '';
      });

      // --- Retour de terrain du 24/08 : viewport meta (zoom de page bloqué,
      // safe-area pour la barre d'accueil iPhone) et bouton filtre en
      // position fixed plutôt qu'absolute (plus robuste) ---
      await verifierAsync('index.html : le zoom de page est désactivé et viewport-fit=cover est présent (zone sûre iOS)', async () => {
        const html = await (await fetch('../index.html')).text();
        return html.includes('user-scalable=no') && html.includes('maximum-scale=1.0') && html.includes('viewport-fit=cover');
      });
      verifier(
        '#bouton-filtres-mobile est en position fixed (pas absolute — plus robuste face aux changements de viewport)',
        getComputedStyle(document.getElementById('bouton-filtres-mobile')).position === 'fixed'
      );

      // --- Installabilité PWA (§11) : manifest.json ---
      await verifierAsync('manifest.json est valide et contient les champs requis pour l\'installabilité', async () => {
        const reponse = await fetch('../manifest.json');
        if (!reponse.ok) return false;
        const manifeste = await reponse.json();
        return manifeste.name === 'Mobilier Urbain'
          && manifeste.display === 'standalone'
          && Array.isArray(manifeste.icons) && manifeste.icons.length >= 2
          && manifeste.icons.some((i) => i.sizes === '192x192')
          && manifeste.icons.some((i) => i.sizes === '512x512');
      });
    }

    async function main() {
      try {
        await chargerFichiersApp();
        executerTestsPurLogique();
        await executerTestsFonctionnels();
      } finally {
        // Nettoyage : la connexion doit être fermée AVANT de supprimer la
        // base, sinon la suppression reste bloquée en silence (onblocked)
        // et laisse une base corrompue (sans object stores) pour la
        // prochaine exécution.
        try {
          const db = await basePromise;
          db.close();
        } catch (e) { /* rien à fermer si l'ouverture avait échoué */ }
        await new Promise((resolve) => {
          const requete = indexedDB.deleteDatabase(DB_NOM_OVERRIDE);
          requete.onsuccess = resolve;
          requete.onerror = resolve;
          requete.onblocked = resolve;
        });
        localStorage.removeItem(CLE_CODE_APPAREIL_OVERRIDE);
        localStorage.removeItem(CLE_COMPTEUR_LOCAL_OVERRIDE);

        document.getElementById('resultats').textContent =
          resultats.join('\n') + `\n\n${ok}/${total} tests OK`
          + (ignores ? ` (+ ${ignores} ignoré(s), cf. SKIP ci-dessus)` : '');
      }
    }

    main();
  </script>
</body>
